version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: manu_ai_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: manu_ai_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=manu_ai
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: manu_ai_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
